# Block-selection eval — realistic doc requests that name NO block type.
#
# Each request scores the PRIMARY block an agent picks (the block that carries
# the main answer):
#   expected   → 1.0   the shapes that answer the reader's question
#   acceptable → 0.5   defensible, but a weaker lens
#   wrong      → 0.0 and counted as a "tempting wrong" hit — the keyword-match
#                trap the request is designed to spring
#   anything else → 0.0
#
# Requests deliberately use words that echo the WRONG block ("timeline" of an
# outage that wants a fishbone, "steps" that want a state machine) so the eval
# separates reasoning from keyword matching. Keep the set stable: a changed
# request invalidates every run before it. Add new ones at the end.

